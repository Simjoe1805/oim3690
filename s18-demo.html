<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price + Tax Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      max-width: 360px;
    }

    label,
    input,
    button,
    p {
      display: block;
      margin-bottom: 10px;
      width: 100%;
    }

    input,
    button {
      padding: 8px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>Simple Tax Calculator</h1>

  <label for="name">Name</label>
  <input id="name" type="text" placeholder="Enter your name">

  <label for="price">Price</label>
  <input id="price" type="number" step="0.01" placeholder="Enter price">

  <label for="tax">Tax ($)</label>
  <input id="tax" type="number" step="0.01" placeholder="Enter tax in dollars">

  <button id="calc-btn" type="button">Calculate</button>

  <p id="total-text">Total: $0.00</p>

  <script>
    const nameInput = document.querySelector("#name");
    const priceInput = document.querySelector("#price");
    const taxInput = document.querySelector("#tax");
    const calcButton = document.querySelector("#calc-btn");
    const totalText = document.querySelector("#total-text");

    calcButton.addEventListener("click", function () {
      const customerName = nameInput.value.trim();
      const price = Number(priceInput.value);
      const taxDollars = Number(taxInput.value);

      if (Number.isNaN(price) || Number.isNaN(taxDollars)) {
        totalText.textContent = "Please enter valid numbers.";
        return;
      }

      const total = price + taxDollars;

      if (customerName === "") {
        totalText.textContent = `Total: $${total.toFixed(2)}`;
        return;
      }

      totalText.textContent = `${customerName}, Total: $${total.toFixed(2)}`;
    });
  </script>
</body>
</html>
