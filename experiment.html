<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What Cat Are You?</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

</head>
<link rel="stylesheet" href="css/experiment.css">
<body>

<!-- Floating cats layer -->
<div class="cats-layer" id="catsLayer" aria-hidden="true"></div>

<div class="container fade" id="app">
  <h1>What Cat Are You?</h1>
  <p>Answer 10 questions and discover your MBTI—and the cat that matches your vibe.</p>
  <button onclick="startQuiz()">Start Quiz</button>
  <div class="tiny">✨ Tip: answer fast—your first instinct is usually most accurate.</div>
</div>

<script>
  // ---- Quiz Data ----
  const questions = [
    { q: "At a party you...",
      a: [
        { text: "Talk to everyone", type: "E" },
        { text: "Stick to close friends", type: "I" }
      ]
    },
    { q: "You trust...",
      a: [
        { text: "Facts & reality", type: "S" },
        { text: "Gut & imagination", type: "N" }
      ]
    },
    { q: "Decisions are based on...",
      a: [
        { text: "Logic", type: "T" },
        { text: "Feelings", type: "F" }
      ]
    },
    { q: "Your life is...",
      a: [
        { text: "Structured", type: "J" },
        { text: "Flexible", type: "P" }
      ]
    },
    { q: "Your energy comes from...",
      a: [
        { text: "Social interaction", type: "E" },
        { text: "Alone time", type: "I" }
      ]
    },
    { q: "You focus on...",
      a: [
        { text: "Present details", type: "S" },
        { text: "Future possibilities", type: "N" }
      ]
    },
    { q: "Conflict is handled with...",
      a: [
        { text: "Rational debate", type: "T" },
        { text: "Emotional understanding", type: "F" }
      ]
    },
    { q: "Plans make you feel...",
      a: [
        { text: "Comfortable", type: "J" },
        { text: "Restricted", type: "P" }
      ]
    },
    { q: "You prefer...",
      a: [
        { text: "Group projects", type: "E" },
        { text: "Independent work", type: "I" }
      ]
    },
    { q: "You value...",
      a: [
        { text: "What is practical", type: "S" },
        { text: "What is meaningful", type: "N" }
      ]
    }
  ];

  // ---- Full 16 MBTI → Cat mapping ----
  const catMap = {
    INTJ: { cat: "Black Cat 🐈‍⬛",        desc: "Strategic, composed, and quietly intense. You observe first—then you act with precision." },
    INTP: { cat: "Russian Blue 🐱",       desc: "Curious mind, minimalist vibe. Independent, analytical, and surprisingly affectionate in private." },
    ENTJ: { cat: "Bengal Cat 🐆",         desc: "Bold, driven, high presence. You lead naturally and move like you own the room." },
    ENTP: { cat: "Siamese Cat 🐾",        desc: "Witty, fast, and impossible to bore. You challenge ideas for fun and charm people doing it." },

    INFJ: { cat: "Ragdoll 🐱",            desc: "Gentle and deep. You read people effortlessly and care in a way that feels rare." },
    INFP: { cat: "Turkish Angora 🐈",     desc: "Dreamy, artistic, and tender. You feel life intensely and turn meaning into beauty." },
    ENFJ: { cat: "Birman Cat 🐾",         desc: "Warm, supportive, magnetic. You bring out the best in people and create belonging." },
    ENFP: { cat: "Orange Tabby 🐈",       desc: "Playful, energetic, chaotic-good. Your optimism is contagious and your ideas come nonstop." },

    ISTJ: { cat: "British Shorthair 🐾",  desc: "Reliable, calm, and steady. You value loyalty, routine, and doing things the right way." },
    ISFJ: { cat: "Scottish Fold 🐱",      desc: "Soft-hearted protector. You notice the small things and make people feel safe." },
    ESTJ: { cat: "Maine Coon 🐈",         desc: "Organized, direct, dependable. You take responsibility naturally—and people trust you." },
    ESFJ: { cat: "Persian Cat 🐱",        desc: "Social, caring, and elegant. You keep the peace and make every space feel welcoming." },

    ISTP: { cat: "Tuxedo Cat 🐈‍⬛",       desc: "Chill, skillful, and self-contained. You stay cool under pressure and improvise like a pro." },
    ISFP: { cat: "Calico Cat 🐾",         desc: "Gentle, aesthetic, free-spirited. You move through life with quiet originality." },
    ESTP: { cat: "Abyssinian 🐈",         desc: "Adventurous, sharp, fearless. You live for the moment and turn risk into excitement." },
    ESFP: { cat: "Sphynx Cat 😼",         desc: "Confident, expressive, and unforgettable. You bring fun, attention, and pure charisma." }
  };

  let current = 0;
  let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

  function startQuiz() {
    current = 0;
    scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    showQuestion();
  }

  function showQuestion() {
    const app = document.getElementById("app");
    const question = questions[current];

    app.innerHTML = `
      <div class="progress">
        <div class="progress-bar" style="width:${(current/questions.length)*100}%"></div>
      </div>
      <h1>${question.q}</h1>
      <div class="options">
        ${question.a.map(ans =>
          `<button onclick="selectAnswer('${ans.type}')">${ans.text}</button>`
        ).join("")}
      </div>
      <div class="tiny">Question ${current + 1} of ${questions.length}</div>
    `;
  }

  function selectAnswer(type) {
    scores[type]++;
    current++;
    if (current < questions.length) showQuestion();
    else showResult();
  }

  function showResult() {
    const mbti =
      (scores.E > scores.I ? "E" : "I") +
      (scores.S > scores.N ? "S" : "N") +
      (scores.T > scores.F ? "T" : "F") +
      (scores.J > scores.P ? "J" : "P");

    const result = catMap[mbti] || { cat: "Mystery Cat 🐾", desc: "A rare and unique feline spirit." };

    document.getElementById("app").innerHTML = `
      <h1>Your Result</h1>
      <div class="chip">${mbti}</div>
      <div class="result-cat">${result.cat}</div>
      <p>${result.desc}</p>
      <button onclick="startQuiz()">Retake Quiz</button>
      <div class="tiny">Share idea: screenshot your result and post it 🐾</div>
    `;
  }

  // ---- Floating Cat Faces ----
  // Creates a field of floating cat faces that drift upward with different speeds/sizes.
  const catEmojis = ["😺","😸","😹","😻","😼","😽","🙀","😿","😾","🐱"];
  const catsLayer = document.getElementById("catsLayer");
  const CAT_COUNT = 22;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function spawnCats() {
    catsLayer.innerHTML = "";
    for (let i = 0; i < CAT_COUNT; i++) {
      const el = document.createElement("div");
      el.className = "cat";
      el.textContent = catEmojis[Math.floor(Math.random() * catEmojis.length)];

      const left = rand(0, 100);
      const size = rand(18, 46);
      const duration = rand(10, 22);
      const delay = rand(0, 12);
      const opacity = rand(0.18, 0.42);

      el.style.left = left + "vw";
      el.style.fontSize = size + "px";
      el.style.animationDuration = duration + "s";
      el.style.animationDelay = "-" + delay + "s"; // negative starts them mid-flight
      el.style.opacity = opacity;

      catsLayer.appendChild(el);
    }
  }

  spawnCats();
  // Optional: refresh cats on resize for better distribution
  window.addEventListener("resize", () => spawnCats());

</script>
</body>
</html>
