<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Examples</title>
</head>
<body>
  <h1>Loop Example: Star Rating</h1>
  <p id="stars"></p>

  <script>
    const rating = 3;
    const container = document.querySelector('#stars');
    let stars = '';

    for (let i = 0; i < 5; i++) {
      if (i < rating) {
        stars += '\u2605';
      } else {
        stars += '\u2606';
      }
    }

    if (container) {
      container.textContent = stars;
    }
  </script>
</body>
</html>
