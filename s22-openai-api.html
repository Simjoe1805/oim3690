<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S22 OpenAI API Demo</title>
</head>
<body>
  <h1>OpenAI API Demo</h1>
  <p id="result">Loading story...</p>

  <script src="js/config.js"></script>
  <script type="module">
    const OPENAI_API_KEY = (window.APP_CONFIG && window.APP_CONFIG.OPENAI_API_KEY)
      || (typeof window.OPENAI_API_KEY !== 'undefined' ? window.OPENAI_API_KEY : '');

    async function askAI(prompt) {
      const response = await fetch('https://api.openai.com/v1/responses', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: 'gpt-5-nano',
          input: prompt
        })
      });
      const data = await response.json();
      return data.output_text;
    }

    const result = document.querySelector('#result');

    try {
      if (!OPENAI_API_KEY) {
        throw new Error('Missing OPENAI_API_KEY in config.js');
      }

      const story = await askAI('Write a one-sentence bedtime story about a unicorn.');
      console.log(story);
      result.textContent = story;
    } catch (error) {
      result.textContent = `Error: ${error.message}`;
    }
  </script>
</body>
</html>
